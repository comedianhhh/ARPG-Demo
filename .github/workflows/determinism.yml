name: determinism

# The fixed-point simulation must produce the same state hash on every OS and CPU architecture.
on:
  push:
    paths: ["ARPG/DemoServer/**", ".github/workflows/determinism.yml"]
  pull_request:
    paths: ["ARPG/DemoServer/**", ".github/workflows/determinism.yml"]
  workflow_dispatch:

jobs:
  hash:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]   # x64, x64, arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths (Unity client paths exceed 260 chars on Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ARPG/DemoServer/ZZZServer.Tests/ZZZServer.Tests.csproj -c Release
      - name: Fixed-point checks + simulation hash vs golden
        run: dotnet run --project ARPG/DemoServer/ZZZServer.Tests/ZZZServer.Tests.csproj -c Release --no-build -- --determinism-only
